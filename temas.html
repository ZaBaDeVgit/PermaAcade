<!DOCTYPE html>

<body class="bg-slate-950 text-white">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-slate-900 border-r border-slate-800 z-40 flex flex-col transition-all duration-300 overflow-hidden -translate-x-full md:translate-x-0">
        <!-- Logo -->
        <div class="p-4 border-b border-slate-800 flex justify-center">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center cursor-pointer hover:scale-105 transition-transform" onclick="toggleSidebarCollapse()">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </div>

        <!-- User Avatar + Info -->

            <div class="text-center">
                <div class="font-semibold text-white user-name">Usuario</div>
                <div class="text-xs text-slate-400">Miembro desde <span class="user-member-since">-</span></div>
            </div>
            <a href="https://ko-fi.com/zabadev" target="_blank" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-400 hover:to-pink-400 transition-all text-white text-xs font-semibold">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Donar</span>

        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-2 overflow-y-auto">
            <ul class="space-y-1">
                <li>
                    <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Inicio">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="temas.html" class="sidebar-link active flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Temas">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Temas</span>
                    </a>
                </li>
                <li>
                    <a href="tests.html" class="sidebar-link flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Tests">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Tests</span>
                    </a>
                </li>
                <li>
                    <a href="lecturas.html" class="sidebar-link flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Resúmenes">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Resúmenes</span>
                    </a>
                </li>
                <li>
                    <a href="videos.html" class="sidebar-link flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Vídeos">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Vídeos</span>
                    </a>
                </li>
                <li>
                    <a href="podcasts.html" class="sidebar-link flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Podcasts">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Podcasts</span>
                    </a>
                </li>
                <li>
                    <a href="presentaciones.html" class="sidebar-link flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all" title="Presentaciones">
                        <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                        <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Presentaciones</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Logout -->
        <div class="p-2 border-t border-slate-800">
            <button onclick="logout()" class="flex items-center gap-3 px-3 py-3 rounded-lg text-slate-300 hover:text-red-400 hover:bg-red-500/10 transition-all w-full" title="Cerrar Sesión">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Cerrar Sesión</span>
            </button>
        </div>
    </aside>

    <!-- Mobile Header -->
    <header class="md:hidden fixed top-0 left-0 right-0 h-16 bg-slate-900 border-b border-slate-800 z-30 flex items-center justify-between px-4">
        <button onclick="toggleSidebar()" class="text-white p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <span class="font-orbitron font-bold text-white">Tropa<span class="text-emerald-400">Perma</span></span>
        <div class="w-10"></div>
    </header>

    <main class="md:ml-64 min-h-screen pt-16 md:pt-0 transition-all duration-300 ml-0">
        <div class="max-w-7xl mx-auto p-4 md:p-8">
            <div class="mb-8">
                <h1 class="font-orbitron font-bold text-2xl md:text-3xl text-white mb-2">Temas del Temario</h1>
                <p class="text-slate-400">Descarga los PDFs oficiales del BOE para estudiar</p>
            </div>

            <!-- Search -->
            <div class="mb-6">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Buscar temas..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 pl-12 text-white focus:border-emerald-500 focus:outline-none" onkeyup="filterTemas()">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <!-- Temas Grid -->
            <div class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 media-grid" id="temasGrid">
                <!-- Temas will be generated by JavaScript -->
            </div>
        </div>
    </main>

    <footer class="md:ml-64 border-t border-slate-800/50 py-6 transition-all duration-300 ml-0">
        <div class="max-w-7xl mx-auto px-4 md:px-8 text-center">
            <div class="text-slate-500 text-sm">Creado por <span class="text-emerald-400 font-semibold">ZaBaDeV</span> © <span id="currentYear"></span> - Academia gratuita para servir a España</div>
        </div>
    </footer>

    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        const currentUser = Auth.getCurrentUser();
        
        const currentYearEl = document.getElementById('currentYear');
        if (currentYearEl) currentYearEl.textContent = new Date().getFullYear();

        const temas = [
            { id: 1, title: 'Constitución Española 1978', desc: 'Texto completo - Títulos I al X', color: 'cyan', pdf: 'pdfs/01_constitucion.pdf' },
            { id: 2, title: 'Ley Orgánica 5/2005 - Defensa Nacional', desc: 'Ley de Defensa Nacional', color: 'emerald', pdf: 'pdfs/02_ley_defensa_nacional.pdf' },
            { id: 3, title: 'Ley 8/2006 - Tropa y Marinería', desc: 'Ley de Tropa y Marinería', color: 'blue', pdf: 'pdfs/03_ley_tropa_marineria.pdf' },
            { id: 4, title: 'RD 205/2024 - Ministerio de Defensa', desc: 'Estructura orgánica del Ministerio', color: 'purple', pdf: 'pdfs/04_real_decreto_205_2024_ministerio_defensa.pdf' },
            { id: 5, title: 'Ley 39/2007 - Carrera Militar', desc: 'Ley de la carrera militar', color: 'amber', pdf: 'pdfs/06_ley_39_2007_carrera_militar.pdf' },
            { id: 6, title: 'Reales Ordenanzas FAS', desc: 'RD 96/2009 - Reales Ordenanzas', color: 'rose', pdf: 'pdfs/07_reales_ordenanzas_fas.pdf' },
            { id: 7, title: 'LO 9/2011 - Derechos y Deberes FAS', desc: 'Derechos y deberes de los militares', color: 'teal', pdf: 'pdfs/08_ley_organica_9_2011_derechos_deberes_fas.pdf' },
            { id: 8, title: 'LO 8/2014 - Régimen Disciplinario', desc: 'Régimen Disciplinario de las FAS', color: 'indigo', pdf: 'pdfs/09_ley_organica_8_2014_regimen_disciplinario_fas.pdf' },
            { id: 9, title: 'Ley 36/2015 - Seguridad Nacional', desc: 'Ley de Seguridad Nacional', color: 'pink', pdf: 'pdfs/10_ley_36_2015_seguridad_nacional.pdf' },
            { id: 10, title: 'Ley 40/2015 - Régimen Jurídico SP', desc: 'Régimen Jurídico del Sector Público', color: 'cyan', pdf: 'pdfs/11_ley_40_2015_regimen_juridico.pdf' },
            { id: 11, title: 'RD 521/2020 - Organización básica FAS', desc: 'Organización básica de las FAS', color: 'emerald', pdf: 'pdfs/12_real_decreto_521_2020_organizacion_basica_fas.pdf' },
            { id: 12, title: 'LO 3/2007 - Igualdad', desc: 'Igualdad efectiva entre mujeres y hombres', color: 'blue', pdf: 'pdfs/13_ley_organica_3_2007_igualdad.pdf' },
            { id: 13, title: 'RD 176/2014 - Iniciativas y Quejas', desc: 'Tramitación de iniciativas y quejas', color: 'purple', pdf: 'pdfs/14_real_decreto_176_2014_iniciativas_quejas.pdf' },
            { id: 14, title: 'Ley 39/2015 - PAC', desc: 'Procedimiento Administrativo Común', color: 'amber', pdf: 'pdfs/15_ley_39_2015_procedimiento_administrativo.pdf' },
            { id: 15, title: 'Orden DEF/111/2019 - Observatorio', desc: 'Observatorio Militar para la igualdad', color: 'rose', pdf: 'pdfs/16_orden_def_111_2019_observatorio_igualdad.pdf' },
            { id: 16, title: 'RD 1150/2021 - Estrategia SN', desc: 'Estrategia de Seguridad Nacional 2021', color: 'teal', pdf: 'pdfs/17_real_decreto_1150_2021_estrategia_seguridad.pdf' },
            { id: 17, title: 'Instr. 55/2021 - EMAD', desc: 'Organización del EMAD', color: 'indigo', pdf: 'pdfs/18_instruccion_55_2021_organizacion_emad.pdf' },
            { id: 18, title: 'Instr. 14/2021 - Ejército de Tierra', desc: 'Organización del Ejército de Tierra', color: 'pink', pdf: 'pdfs/19_instruccion_14_2021_organizacion_ejercito_tierra.pdf' },
            { id: 19, title: 'Instr. 15/2021 - Armada', desc: 'Organización de la Armada', color: 'cyan', pdf: 'pdfs/20_instruccion_15_2021_organizacion_armada.pdf' },
            { id: 20, title: 'Instr. 6/2025 - Ejército del Aire', desc: 'Organización del Ejército del Aire', color: 'emerald', pdf: 'pdfs/21_instruccion_6_2025_organizacion_ea.pdf' }
        ];

        function renderTemas(filter = '') {
            const grid = document.getElementById('temasGrid');
            const filtered = temas.filter(t => t.title.toLowerCase().includes(filter.toLowerCase()) || t.desc.toLowerCase().includes(filter.toLowerCase()));
            const completed = currentUser.progress.temas || [];
            
            grid.innerHTML = filtered.map(tema => `
                <div class="tema-card bg-slate-900/50 border border-slate-800/50 rounded-xl p-6 hover:border-${tema.color}-500/50 transition-all">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-${tema.color}-500/20 flex items-center justify-center">
                            <span class="text-${tema.color}-400 font-bold text-lg">${tema.id}</span>
                        </div>
                        ${completed.includes(tema.id) ? '<span class="text-emerald-400 text-sm">✓ Completado</span>' : ''}
                    </div>
                    <h3 class="font-semibold text-white text-lg mb-2">${tema.title}</h3>
                    <p class="text-slate-400 text-sm mb-4">${tema.desc}</p>
                    <div class="flex flex-wrap gap-2">
                        <a href="${tema.pdf}" target="_blank" class="flex-1 text-center px-4 py-2 bg-${tema.color}-500/20 text-${tema.color}-400 hover:bg-${tema.color}-500/30 rounded-lg text-sm font-medium transition-colors">
                            📖 Leer PDF
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function openTema(id) {
            updateProgress('temas', id);
            const tema = temas.find(t => t.id === id);
            if (tema) {
                window.open(tema.pdf, '_blank');
            }
        }

        function filterTemas() {
            const search = document.getElementById('searchInput').value;
            renderTemas(search);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('sidebar');
            const main = document.querySelector('main');
            const footer = document.querySelector('footer');
            const collapseIcon = document.getElementById('collapseIcon');
            const texts = document.querySelectorAll('.sidebar-text');
            
            if (sidebar.classList.contains('w-64')) {
                // Collapse
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                main.classList.remove('md:ml-64');
                main.classList.add('md:ml-20');
                if (footer) {
                    footer.classList.remove('md:ml-64');
                    footer.classList.add('md:ml-20');
                }
                collapseIcon.classList.add('rotate-180');
                texts.forEach(t => t.classList.add('opacity-0'));
            } else {
                // Expand
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                main.classList.remove('md:ml-20');
                main.classList.add('md:ml-64');
                if (footer) {
                    footer.classList.remove('md:ml-20');
                    footer.classList.add('md:ml-64');
                }
                collapseIcon.classList.remove('rotate-180');
                texts.forEach(t => t.classList.remove('opacity-0'));
            }
        }

        renderTemas();
    </script>
</body>
</html>
